services:

  
  api:
    build: .
    ports:
      - "3002:3002"
    environment:
      - DB_HOST=localhost          # nombre del servicio de base de datos
      - DB_PORT=5432
      - DB_NAME=tienda_backend
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - PORT=3002
    depends_on:
      db:
        condition: service_healthy  # espera a que PostgreSQL esté listo
    restart: unless-stopped

  # Servicio 2: PostgreSQL
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=tienda_backend
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data  # los datos persisten aunque el contenedor se reinicie
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:  # volumen nombrado gestionado por Docker